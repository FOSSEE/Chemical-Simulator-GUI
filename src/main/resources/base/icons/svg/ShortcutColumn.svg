  </g>
  <!-- condenser -->
  <circle cx="62" cy="18" r="10" fill="none" stroke="#004646" stroke-width="2.4"/>
  <path d="M54,11 L70,25" stroke="#e2001a" stroke-width="2.2" stroke-linecap="round"/>
  <!-- reboiler -->
  <circle cx="62" cy="227" r="10" fill="none" stroke="#004646" stroke-width="2.4"/>
  <path d="M54,220 L70,234" stroke="#e2001a" stroke-width="2.2" stroke-linecap="round"/>
