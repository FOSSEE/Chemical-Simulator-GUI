<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 245">
  <g fill="none" stroke="#004646" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- column vessel with rounded caps -->
    <path d="M8,52 Q8,35 25,35 Q42,35 42,52 V193 Q42,210 25,210 Q8,210 8,193 Z"/>
    <!-- feed line -->
